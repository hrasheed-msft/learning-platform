name: Run Production Seed

# Manually triggered — select which seed to run from the GitHub Actions UI
# or via: gh workflow run run-seed.yml -f seed=maktab-coursebook-5

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed script to run (without path/extension, e.g. seed-maktab-coursebook-5)'
        required: true
        default: 'seed-maktab-coursebook5'
        type: choice
        options:
          - seed-maktab-coursebook5
          - seed-maktab-coursebook1
          - seed-maktab-coursebook2
          - seed-maktab-coursebook3
          - seed-maktab-coursebook4
          - seed-maktab-coursebook6boys
          - seed-maktab-coursebook6girls
          - seed-maktab-coursebook7
          - seed-maktab-coursebook8
          - seed-maktab-foundation1
          - seed-maktab-foundation2
          - seed-maktab-further-studies-nw
          - seed-maktab-program
          - seed-production

jobs:
  run-seed:
    name: Run ${{ github.event.inputs.seed }}
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Log into Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get DATABASE_URL from Container App
        id: get-db-url
        run: |
          APP="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.RESOURCE_GROUP }}"

          # Try 1: plain env var (value stored directly)
          DB_URL=$(az containerapp show \
            --name "$APP" --resource-group "$RG" \
            --query "properties.template.containers[0].env[?name=='DATABASE_URL'].value | [0]" \
            --output tsv 2>/dev/null || true)

          # Try 2: env var is a secretRef — look up the secret value
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "None" ] || [ "$DB_URL" = "null" ]; then
            SECRET_NAME=$(az containerapp show \
              --name "$APP" --resource-group "$RG" \
              --query "properties.template.containers[0].env[?name=='DATABASE_URL'].secretRef | [0]" \
              --output tsv 2>/dev/null || true)
            if [ -n "$SECRET_NAME" ] && [ "$SECRET_NAME" != "None" ] && [ "$SECRET_NAME" != "null" ]; then
              DB_URL=$(az containerapp secret show \
                --name "$APP" --resource-group "$RG" \
                --secret-name "$SECRET_NAME" \
                --query "value" --output tsv 2>/dev/null || true)
            fi
          fi

          if [ -z "$DB_URL" ] || [ "$DB_URL" = "None" ] || [ "$DB_URL" = "null" ]; then
            echo "❌ Could not retrieve DATABASE_URL from Container App"
            echo "   App: $APP  RG: $RG"
            echo "   Env vars present:"
            az containerapp show --name "$APP" --resource-group "$RG" \
              --query "properties.template.containers[0].env[].name" --output tsv || true
            exit 1
          fi

          echo "::add-mask::$DB_URL"
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Run seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ steps.get-db-url.outputs.db_url }}
        run: |
          echo "🌱 Running ${{ github.event.inputs.seed }}..."
          npx ts-node --transpile-only prisma/${{ github.event.inputs.seed }}.ts
          echo "✅ Seed complete"
